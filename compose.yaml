# Local development stack. Start it with:  docker compose up -d
# Step 1 runs only the two data services; later steps add moto, the API, and the worker.
name: cornerman

services:
  postgres:
    image: postgres:18.6
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"   # reachable from this PC only, not from your network
    volumes:
      - pgdata:/var/lib/postgresql   # Postgres 18 keeps its data under this folder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
