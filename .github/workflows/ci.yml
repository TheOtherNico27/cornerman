name: CI

on:
  pull_request:
  push:
    branches: [main]

# The default token can only read the repo unless a job asks for more.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install dependencies exactly as locked
        run: uv sync --locked   # fails if uv.lock doesn't match pyproject.toml
      - name: Lint
        run: uv run ruff check
      - name: Check formatting
        run: uv run ruff format --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install dependencies exactly as locked
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -q

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan every commit, not just the latest
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
